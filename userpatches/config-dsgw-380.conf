# Dusun DSGW-380: minimal Ubuntu noble image with the Rockchip vendor 6.1 kernel.
# Build: ./compile.sh dsgw-380
# The host must have ext4 loaded first: sudo modprobe ext4
BOARD=dusun-dsgw-380
BRANCH=vendor
RELEASE=noble
BUILD_MINIMAL=yes
BUILD_DESKTOP=no
KERNEL_CONFIGURE=no
NETWORKING_STACK=network-manager # nmcli/NetworkManager instead of the minimal-image default systemd-networkd
